###
# train_expert schema
# Records trajectories for an expert model.
# Outputs the .pth files for expert and optimizer trajectories.
###

[train_expert]
output_dir = "string. Path to output directory (slurm compatible)."
model = "string: {r32p, r18, r18_tin, vgg, vgg_pretrain, vit_pretrain}. For ResNets, VGG-19s, and ViTs."
dataset = "string: {cifar, cifar_100, tiny_imagenet}. For CIFAR-10, CIFAR-100 and Tiny Imagenet datasets."
trainer = "string: {sgd, adam}. Specifies optimizer."
source_label = "int: {-1,0,...,9}. Specifies label to mimic. -1 indicates all labels."
target_label = "int: {0,1,...,9}. Specifies label to attack."
poisoner = "string: Form: {{1,2,3,9}xp, {1,2}xs, {1,4}xl}. Integer resembles number of attacks and string represents type."
checkpoint_iters = "int: {0,1,...,infty}. Number of iterations between each checkpoint record."

[OPTIONAL]
delta = "str. Path for optimized trigger"
batch_size = "int: {0,1,...,infty}. Specifies batch size. Set to default for trainer if omitted."
epochs = "int: {0,1,...,infty}. Specifies number of epochs. Set to default for trainer if omitted."
train_pct = "float: [0, 1]. Specifies percentage of dataset available to attacker. Set to 1 by default."
optim_kwargs = "dict. Optional keywords for Pytorch SGD / Adam optimizer. See sever example."
scheduler_kwargs = "dict. Optional keywords for Pytorch learning rate optimizer (with SGD). See sever example. NOTE: this key was misdocumented as 'schedule_kwargs' (missing 'r') before this correction -- run_module.py has always read 'scheduler_kwargs' (see below), so any config that followed the old, misspelled schema key had its scheduler settings silently ignored and trained with the scheduler's plain defaults regardless of what was configured. Expert checkpoints produced before this correction may therefore have used the default scheduler even if a custom schedule_kwargs was set in their config -- re-check/re-train if a specific LR schedule was assumed for those checkpoints."
budget = "int: number of flipped labels allowed for this attack."
wandb = "dict: {enabled: bool, project: str, entity: str (optional), mode: str {online, offline, disabled} (optional, default online), tags: list[str] (optional), group: str (optional), run_name: str (optional)}. If enabled=true, per-step metrics and the auto-generated loss-curve plots are also mirrored to Weights & Biases via modules/base_utils/experiment_tracker.py's ExperimentTracker. Absent or enabled=false (default): no W&B activity; local plots/metrics under experiments/<experiment_name>/{plots,logs}/<module_name>/ are produced either way."
