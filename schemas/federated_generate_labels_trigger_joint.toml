###
# federated_generate_labels_trigger_joint schema
# Threat model "direct", REAL coupling: extends federated_generate_labels to jointly optimize
# continuous poisoned logit labels (labels_syn) AND a backdoor trigger (delta), via federated
# trajectory matching -- like federated_generate_labels_trigger, but with delta's gradient
# ALSO flowing through the MTT trajectory-alignment term (param_loss), not just through the
# isolated backdoor-efficacy term L_bd. See modules/federated_generate_labels_trigger_joint/
# run_module.py's run() docstring for the full derivation ("E2 implementation").
#
# A separate module from federated_generate_labels_trigger (which keeps the INDIRECT
# coupling, unmodified) -- the three modules (federated_generate_labels,
# federated_generate_labels_trigger, this one) are meant to coexist and be compared, not
# to replace one another.
#
# Outputs the same labels.npy/true.npy/losses.npy as federated_generate_labels (consumed
# unchanged by federated_select_flips), plus the optimized trigger as a .pt file (same naming
# convention as federated_optimizing_trigger/federated_optimizing_trigger_policy).
###

[federated_generate_labels_trigger_joint]
input_pths = "string. Format string path to model checkpoint .pth files with three '{}'s."
opt_pths = "string. Format string path to optimizer checkpoint .pth files with three '{}'s."
output_dir = "string. Path to output directory (slurm compatible)."
output_dir_trigger = "string. Path to output directory for the optimized trigger .pt (slurm compatible)."
expert_model = "string: {r32p, r18, r18_tin, vgg, vgg_pretrain, vit_pretrain}. For ResNets, VGG-19s, and ViTs. Also used as the trigger's model_flag (needs_big_ims / preprocessing)."
dataset = "string: {cifar, cifar_100, tiny_imagenet, svhn}. For CIFAR-10, CIFAR-100, Tiny Imagenet and SVHN datasets."
source_label = "int: {-1,0,...,9}. Specifies label to mimic. -1 indicates all labels."
target_label = "int: {0,1,...,9}. Specifies label to attack."

###
# Trigger hyperparameters -- same names as federated_optimizing_trigger_policy /
# federated_generate_labels_trigger.
###
epsilon = "float: (0, +infty). L_infinity bound on trigger delta."
lr_delta = "float: (0, +infty). Learning rate for trigger optimization (Adam)."

###
# Loss weights: grand_loss (MTT alignment against the DIFFERENTIABLE expert_next, see
# run_module.py + lam*L1 reg) is further extended, via an isolated backward pass restricted to
# delta, with lambda_bd*L_bd (kappa in the P^mean/P^direct formulas: weight of the backdoor
# loss on triggered examples -- an ADDITIONAL contribution to delta.grad now that param_loss
# also contributes one, not a duplicate), and, added directly into grand_loss:
# lambda_penalty*L_pen + lambda_delta*||delta|| + lambda_tv*L_tv (optional trigger
# regularizers, reused unchanged from federated_optimizing_trigger, default 0). Sweep
# lambda_bd over >= 3 values and watch expert_asr (metrics_log_path) alongside the matching
# term for the matching-collapses-the-backdoor failure mode (see run() docstring).
###
lambda_bd = "float: [0, +infty). Weight for L_bd (kappa in the P^mean/P^direct formulas). Defaults to 1.0."

[OPTIONAL]
batch_size = "int: {0,1,...,infty}. Specifies batch size. Set to default for trainer if omitted."
epochs = "int: {0,1,...,infty}. Specifies number of epochs. Set to default for trainer if omitted."
train_pct = "float: [0, 1]. Specifies percentage of dataset available to attacker. Set to 1 by default."
lambda = "float: [0, infty]. Specifies label L1-regularization parameter. Set to 0 by default."
expert_config = "dict. Specifies expert checkpoints. Set to default if omitted."
attack_config = "dict. Specifies algorithm parameters. Set to default if omitted."
num_honests = "int: {0,1,...,infty}. Num of honest workers."
num_poisoned = "int: {0,1,...,infty}. Num of poisoned workers."
clean_trajectory = "bool. Train expert on clean or poisoned data."
agg_method = "str: aggregation method for the (differentiable) student gradient aggregation. Must be 'mean' (default) to stay comparable with federated_optimizing_trigger_policy's (P^mean) objective -- a WARNING is printed otherwise."
attack = "str: attack performed."
gamma_stealth = "float: [0, 1]. Scalar stealth/backdoor loss weight multiplying grand_loss. UNRELATED to federated_optimizing_trigger_policy's gamma = num_poisoned/(num_poisoned+num_honests) -- disjoint concept, same name previously (see docs/threat_models_audit.md). Defaults to 1.0."
gamma = "[DEPRECATED] float: [0, 1]. Old name for gamma_stealth -- still accepted (with a DeprecationWarning) so existing configs keep working. Mutually exclusive with gamma_stealth. Prefer gamma_stealth."
init = "str: {stripe, random}. Trigger initialization (init_delta, modules/federated_optimizing_trigger/utils.py). 'stripe' (default): deterministic sinusoidal pattern (uses freq/horizontal). 'random': strength * torch.rand(mu_shape) -- drawn from torch's GLOBAL RNG, so it is NOT reproducible across runs/processes unless the caller seeds torch itself beforehand; ignores freq/horizontal."
lambda_penalty = "float: [0, +infty). Weight for the hinge trigger penalty relative to mu. Defaults to 0.0."
lambda_delta = "float: [0, +infty). Weight for L2 norm penalty on delta. Defaults to 0.0."
lambda_tv = "float: [0, +infty). Weight for total-variation penalty on delta. Defaults to 0.0."
kappa = "float: [0, +infty). Hinge margin for the (optional) trigger penalty -- NOT the P^mean/P^direct formulas' kappa (see lambda_bd). Defaults to 0.0."
alpha_ckpt = "float: (0, 1]. Controls bias toward early expert-trajectory checkpoints when drawing each (iteration, trajectory-length) expert start, when checkpoint_sampling='biased' -- SAME distribution/parameter federated_optimizing_trigger_policy's sample_checkpoints uses, for checkpoint-sampling comparability between the two threat models. Defaults to 0.01. Unused when checkpoint_sampling='uniform'."
checkpoint_sampling = "string: {uniform, biased}. Which distribution draws each (iteration, trajectory-length) expert-trajectory checkpoint index: 'uniform' (extract_experts, np.random.randint) or 'biased' (extract_experts_biased, exponential bias via alpha_ckpt -- same family federated_optimizing_trigger_policy's sample_checkpoints uses). Defaults to 'biased' in THIS module (its behavior before this parameter existed) -- federated_generate_labels_trigger defaults to 'uniform' (its own prior behavior) instead. Set both modules to the SAME value to remove checkpoint sampling as a factor when comparing them."
metrics_log_path = "string. If set, path (slurm compatible) to a JSON file where per-batch metrics (grand_loss, matching_term, L_bd_mean, expert_asr, delta_l2, delta_linf, cos_target, cos_source, L_align, L_mag, align_active_rate, mag_active_rate, reg_term, L_gradmatch) are recorded across training -- mandatory instrumentation for any lambda_bd/lambda_align/align_kappa/lambda_gradmatch sweep or anti-collapse monitoring (see run() docstring)."
trigger_constraint = "string: {penalty, projection}. How the anti-collapse directional/magnitude floors on delta are enforced: 'penalty' (default) adds lambda_align*L_align + lambda_mag*L_mag as soft terms to grand_loss (project_trigger_constraints is NOT called; the plain epsilon clamp_ still runs). 'projection' instead enforces {||delta||_inf<=epsilon} inter {cos(delta,mu_target)>=align_kappa} inter {||delta||_2>=delta_min} as hard constraints via alternating projection after every optimizer_delta.step() (project_trigger_constraints, joint/utils.py) -- lambda_align/lambda_mag are then unused (not added to grand_loss, to avoid double-enforcing)."
align_kappa = "float: [-1, 1]. Floor threshold for cos(delta, mu_target): L_align = relu(align_kappa - cos(delta, mu_target)) is zero once the cosine reaches align_kappa, active below it (a FLOOR -- do not confuse with the unrelated kappa above, trigger_penalty_hinge's STEALTH ceiling on cos(delta, mu_target-mu_source)). Also the cone half-angle (arccos(align_kappa)) under trigger_constraint='projection'. Defaults to 0.6."
lambda_align = "float: [0, +infty). Weight for L_align (the directional floor) when trigger_constraint='penalty'. Defaults to 0.0 (P1 fix, 2026-09-04 -- was 1.0: a stripe-like, ~eps-saturated global delta has cos(delta, mu_target)~=0, so this floor stayed permanently active and pushed delta toward mu_target, a smooth/low-frequency/positive-everywhere direction that is the OPPOSITE of the anti-aligned prior identified as load-bearing for surviving robust aggregators -- see margin_floor_penalty/lambda_margin below for the anti-collapse mechanism that replaces it). Unused under 'projection'. Under trigger_constraint='projection', the cone projection step itself is now also skipped whenever align_kappa<=0 (see project_trigger_constraints, joint/utils.py)."
lambda_mag = "float: [0, +infty). Weight for L_mag = relu(delta_min - ||delta||_2) (the magnitude floor, without which L_align is vacuously satisfiable via delta -> 0) when trigger_constraint='penalty'. Defaults to 1.0. Unused under 'projection'."
delta_min_frac = "float: (0, 1]. Magnitude floor delta_min = delta_min_frac * epsilon*sqrt(numel(delta)) -- the FEASIBLE ||delta||_2 ceiling under ||delta||_inf<=epsilon, NOT a fraction of delta's raw (pre-clamp, strength=6.0) init norm as this was previously computed (BUG FIX, 2026-09-04): that old formula could place delta_min far ABOVE the feasible ceiling (e.g. ~21x on a CIFAR/epsilon=0.1/strength=6.0 combination), making L_mag's floor permanently unsatisfiable -- its gradient w.r.t. delta then has constant L2 norm 1.0 regardless, which Adam's per-coordinate normalization turns into a persistent `+lr*sign(delta_i)` push, pinning every coordinate to its INIT sign at +-epsilon for the whole run (delta effectively never optimized -- see docs/threat_models_audit.md). Raises ValueError at startup if delta_min_frac>1.0 (structurally infeasible under the new formula). Defaults to 0.8 (was 0.5 of the old, infeasible reference) -- targets ~80% saturation of the Linf cube, the global/low-per-coordinate-amplitude/saturated profile identified as what survives coordinate-wise defenses."
pool_size = "int: {1,...,+infty}. Number of expert checkpoints preloaded into RAM (float32, CPU) once at startup; one is drawn uniformly at random per outer step, instead of a single checkpoint indexed sequentially by the step -- conditioning every step's gradient on a single trajectory point made optimization unstable. pool_size=1 keeps the original sequential-per-step behavior exactly (bit-for-bit). Clamped to the number of distinct checkpoints actually sampled for this run if larger. Defaults to 15."
n_checkpoints_per_step = "int: {1,...,pool_size}. If > 1, every batch-step draws this many DISTINCT checkpoints from the pool (instead of just one) and averages each checkpoint's own matching term/gradient-mismatch penalty into grand_loss before a single backward() -- see run() docstring 'Averaging the loss over multiple checkpoints'. Requires pool_size > 1 and pool_size >= n_checkpoints_per_step (raises ValueError otherwise). Memory scales roughly linearly with this value (n_checkpoints_per_step distinct model instances + their create_graph=True graphs held simultaneously). Defaults to 1 (unchanged, single-checkpoint-per-step behavior, bit-for-bit)."
expert_retrain_interval = "int: {0,1,...,+infty}. Every this many outer iterations (each one full epoch over mtt_dataset, see attack_config.iterations), retrain a FRESH expert from scratch against the CURRENT trigger for expert_retrain_epochs epochs, and splice its checkpoints in as the expert trajectory for the remaining iterations (closes the H1 gap documented in run()'s docstring: unlike federated_optimizing_trigger_policy, this module's expert was never retrained against its own current trigger). 0 (default) disables this entirely -- unchanged behavior, a single frozen expert trajectory for the whole run."
expert_retrain_epochs = "int: {1,...,+infty}. Epochs per retraining round when expert_retrain_interval>0 -- same meaning as train_expert's own `epochs`. Unused when expert_retrain_interval=0. Defaults to 20."
expert_retrain_checkpoint_iters = "int: {1,...,+infty}. Checkpoint-saving frequency (in training iterations) during each retraining round -- same meaning as train_expert's own `checkpoint_iters`. MUST stay consistent with expert_config's own `trajectories` granularity (a trajectory value like 150 is only ever hit if it is a multiple of this) for the post-retrain checkpoint redraw to find checkpoints at the sampled positions -- same constraint the original, one-off train_expert step's own checkpoint_iters already had to satisfy. Unused when expert_retrain_interval=0. Defaults to 50."
expert_retrain_optim_kwargs = "dict. Optional keywords for the retraining round's SGD optimizer (see train_expert's own optim_kwargs). Unused when expert_retrain_interval=0. Set to the trainer's default if omitted."
expert_retrain_scheduler_kwargs = "dict. Optional keywords for the retraining round's LR scheduler (see train_expert's own scheduler_kwargs). Unused when expert_retrain_interval=0. Set to the trainer's default if omitted."
seed = "int. If set AND expert_retrain_interval>0, reseeds Python's random, numpy, and torch RNGs (random.seed/np.random.seed/torch.manual_seed) at the START of every expert-retraining round, before building that round's poisoned dataset and initializing the fresh model -- pass the SAME value as the original train_expert step's own `seed` (see schemas/train_expert.toml) so the retrained expert's weight init and data order replicate the ORIGINAL expert's exactly, leaving the poisoned trigger as the only source of difference between them. Has no effect on the main label/trigger optimization loop itself (only on _retrain_expert_with_trigger's fresh model), and no effect at all when expert_retrain_interval=0. Unset (default): unseeded, exactly as before this field existed."
lambda_gradmatch = "float: [0, +infty). Weight for L_gradmatch = ||grad(L_c)(theta_k) - grad(L_p)(theta_k)(delta)||^2 / ||grad(L_c)(theta_k)||^2, added directly into grand_loss -- grad(L_c) is the mean gradient (at the current expert checkpoint) of the classification loss over genuinely clean examples (no poison in inputs or labels), grad(L_p)(delta) the mean gradient over genuinely poisoned examples (triggered inputs + target labels), both flattened across all expert_model parameters. Penalizes delta for making the poisoned-example gradient distinguishable from the clean-example one. 0.0 (default) is a full no-op -- also skips the extra clean-subset forward pass this term otherwise requires for poisoned clients."
gradmatch_eps = "float: (0, +infty). Denominator-stabilizing epsilon for L_gradmatch (guards against division by zero, both metrics). Unused when lambda_gradmatch=0. Defaults to 1e-8."
gradmatch_metric = "string: {relerr, cosine}. Distance used by L_gradmatch between grad(L_c)(theta_k) and grad(L_p)(theta_k)(delta). 'relerr' (default): scale-sensitive relative squared error ||.-.||^2/||grad(L_c)||^2. 'cosine': scale-invariant 1 - cos(.,.) -- only penalizes a direction mismatch, not a magnitude one. Unused when lambda_gradmatch=0. Defaults to 'relerr'."
lambda_match = "float: [0, +infty). Weight for L_match = 1 - cos(agg_expert_grads, grad(L_p)(theta_k)(delta)), added directly into grand_loss -- agg_expert_grads is the DIFFERENTIABLE, already-aggregated (agg_method-mixed across all clients) expert gradient this checkpoint's param_loss/param_dist already compute; grad(L_p)(delta) is poison_grad_mean, shared with L_gradmatch above. Unlike L_gradmatch (a stealth term: makes the poisoned gradient look CLEAN), L_match directly rewards delta for making the REALISTIC, already-aggregated gradient point toward the poison-only direction -- ported from federated_optimizing_trigger's old (pre-joint, trigger-then-labels) L_match objective. 0.0 (default) is a full no-op. Enabling this alone (lambda_gradmatch left at 0) still triggers poison_grad_chunks collection but skips the clean-subset-only forward pass L_gradmatch needs."
lambda_lpips = "float: [0, +infty). Weight for a perceptual (LPIPS, lpips.LPIPS(net='alex')) penalty between the clean raw image and its triggered counterpart, accumulated into delta.grad the same way as lambda_bd's L_bd term (manual torch.autograd.grad, not through grand_loss.backward()). 0.0 (default) is a full no-op -- the lpips package is imported lazily and only instantiated when this is > 0, so it remains an optional dependency for every other config."
lambda_joint = "float: [0, +infty). Weight for L_joint, an additional term accumulated into delta.grad the same manual way as lambda_bd's L_bd term (torch.autograd.grad, not through grand_loss.backward(), no extra forward pass -- reuses loss_e, already computed per poisoned client). Unlike L_bd (poisoned rows only), L_joint is the gradient w.r.t. delta of the classification loss over that client's WHOLE local batch -- clean rows AND poisoned rows, real inputs/labels -- giving a direct, separately-tunable pressure to keep the model's clean-task loss low alongside backdoor efficacy, independent of param_loss's indirect (and matching-entangled) coupling. 0.0 (default) is a full no-op, identical to the module's behavior before this term existed. Logged separately as L_joint_mean/L_joint_mean_std (metrics_log_path/tracker.log), never merged into L_bd_mean."
detach_param_dist = "bool. mtt_term_k = param_loss / param_dist -- param_dist is itself differentiable w.r.t. delta (same as param_loss's numerator), so by default delta could lower mtt_term_k by shrinking param_dist rather than by improving the numerator's actual matching. If true, param_dist is detached before the division (param_loss / param_dist.detach()), so delta only receives gradient through the numerator; the denominator still normalizes by this step's true trajectory distance. Defaults to false (denominator stays fully differentiable, the module's original behavior)."

###
# Robustness-hardening terms (2026-09-04, see the accompanying diagnostic writeup's D0-D5):
# added to make delta's own contribution survive robust aggregators (trimmed-mean, median,
# Krum/Multi-Krum) at deployment, not just the mean -- all default to 0.0 (full no-op).
###
lambda_margin = "float: [0, +infty). Weight for L_margin = relu(margin_min - (logit_target - best_other_logit)), meaned over triggered rows and checkpoints, added directly into grand_loss (margin_floor_penalty, joint/utils.py). Replaces lambda_align/directional_floor_penalty as the anti-collapse mechanism: a floor on the backdoor's OWN classification margin (efficacy) instead of on delta's resemblance to mu_target (which actively worked against the winning anti-aligned trigger pattern -- see lambda_align's own doc). 0.0 (default) is a full no-op."
margin_min = "float. Target classification margin (logit_target - best_other_logit) on triggered rows for L_margin's floor. Unused when lambda_margin=0. Defaults to 2.0."
lambda_consistency = "float: [0, +infty). Weight for L_consistency = poison_consistency(poison_grad_chunks) = 1 - mean cos(each poisoned CLIENT's contributing gradient, their mean), added directly into grand_loss (poison_consistency, joint/utils.py). Restores pressure toward a low-VARIANCE poison gradient across clients -- what robust aggregators specifically attenuate (variance, not magnitude), as opposed to the high-per-example-variance/low-mean profile a naive joint-label optimization can produce. Vacuously 0.0 whenever num_poisoned<=1 (only one contributing client -> trivially self-cosine 1) -- only informative at num_poisoned>=2. The underlying poison_consistency VALUE is always computed/logged (metrics_log_path's `poison_consistency`/`L_consistency` fields) regardless of this weight -- mandatory instrumentation for D5. 0.0 (default) is a full no-op for grand_loss."
lambda_budget = "float: [0, +infty). Weight for L_budget = coordinate_budget_penalty(agg_expert_grads, honest_grads_flat, z_budget) (joint/utils.py), added directly into grand_loss. A differentiable substitute for coordinate-wise robustness: penalizes the REALISTIC aggregate (agg_expert_grads, agg_method-mixed, DIFFERENTIABLE w.r.t. delta) for deviating, coordinate-by-coordinate, more than z_budget honest standard deviations from the honest per-coordinate mean this batch -- deliberately NOT aggregator-aware in the excluded sense (Krum's argmin and the median's selection are both piecewise-constant / locally zero-gradient; this term stays differentiable everywhere). Requires num_honests>0 (there is no honest per-coordinate std to measure otherwise) -- a no-op (0.0) regardless of this weight when num_honests=0. 0.0 (default) is a full no-op."
z_budget = "float: (0, +infty). Per-coordinate budget for L_budget, in units of the honest per-coordinate std this batch. MUST be calibrated empirically per agg_method, not guessed -- see prelim/calibrate_z_budget.py (perturbs real honest gradients by z*sigma per coordinate, passes them through agg() for each agg_method, and reports the largest z whose perturbation still survives aggregation). Expected order of magnitude: 0.7-1.0 for trimmed-mean (beta=0.2), notably lower for the pure median. Unused when lambda_budget=0 or num_honests=0. Defaults to 1.0."
expert_retrain_agg_method = "string. DOCUMENTED NO-OP (2026-09-04): _retrain_expert_with_trigger's own retraining call (mini_train) is a plain CENTRALIZED training run over the whole poisoned dataset -- it has no federated client split or aggregator of its own to parameterize, so this value is read but never branched on (a WARNING is printed if it differs from agg_method). Exposed so the gap (expert retraining currently always happens under an implicitly undefended regime, regardless of the victim's own agg_method) is visible in configs rather than silently assumed away; wiring a real robust-aware retraining loop would require rewriting mini_train's call into a per-client-split-then-aggregate loop (out of scope for this pass). Defaults to agg_method's own value (i.e. never differs unless explicitly set otherwise)."
lambda_balance_interval = "int: {0,1,...,+infty}. If > 0, every this many batch-steps (global_step, not outer `it`), recalibrates a subset of the delta-facing loss weights (lambda_bd, lambda_gradmatch, lambda_lpips, and lambda_consistency/lambda_budget once their own weight is already nonzero) so each term's OWN gradient-norm w.r.t. delta matches a target FRACTION (lambda_balance_ratios) of the MTT matching term's (gamma_stealth*mtt_term_avg) gradient norm, via a sqrt-damped fixed-point update (each recalibration moves only partway to the target, converging over repeated intervals rather than jumping there) clamped to [lambda_balance_min, lambda_balance_max]. Meant to reduce the combinatorial grid search a 6-7-term loss would otherwise require -- NOT a substitute for the individual weights' own semantics, and best treated as an experimental convenience: verify behavior on a real run before relying on it for a campaign. Recalibrated values are logged per-step (metrics_log_path's `lambda_*_current` fields). 0 (default) disables this entirely -- every lambda_i stays exactly at its own configured value, unchanged behavior."
lambda_balance_ratios = "dict: {str: float}. Target gradient-norm fractions (of the MTT term's own gradient norm) for lambda_balance_interval's recalibration, keyed by term name ('L_bd', 'L_consistency', 'L_budget', 'L_gradmatch', 'L_lpips'). Unused when lambda_balance_interval=0. Defaults to {L_bd: 0.45, L_consistency: 0.20, L_budget: 0.20, L_gradmatch: 0.10, L_lpips: 0.05}."
lambda_balance_min = "float: (0, +infty). Lower clamp on any lambda_i recalibrated by lambda_balance_interval. Unused when lambda_balance_interval=0. Defaults to 1e-4."
lambda_balance_max = "float: (0, +infty). Upper clamp on any lambda_i recalibrated by lambda_balance_interval. Unused when lambda_balance_interval=0. Defaults to 1e4."

wandb = "dict: {enabled: bool, project: str, entity: str (optional), mode: str {online, offline, disabled} (optional, default online), tags: list[str] (optional), group: str (optional), run_name: str (optional)}. If enabled=true, per-step metrics and the auto-generated loss-curve plots are also mirrored to Weights & Biases via modules/base_utils/experiment_tracker.py's ExperimentTracker. Absent or enabled=false (default): no W&B activity; local plots/metrics under experiments/<experiment_name>/{plots,logs}/<module_name>/ are produced either way."
